# Data Centre Assumptions
# Version: 2026-02
# Source: Uptime Institute Annual Survey 2024, IEA Data Centres report 2024,
#         Google/Microsoft/Meta sustainability reports 2024

pue_by_type:
  hyperscale:
    baseline_2024: 1.15
    range: [1.05, 1.30]
    distribution: triangular
    rationale: "Hyperscalers publish PUE; Google avg 1.10, industry range 1.05-1.30"
    confidence_tier: 1
  sovereign:
    baseline_2024: 1.30
    range: [1.15, 1.50]
    distribution: triangular
    rationale: "Sovereign cloud less optimised; EU CoC data; wider range"
    confidence_tier: 2
  colocation:
    baseline_2024: 1.45
    range: [1.25, 1.70]
    distribution: triangular
    rationale: "Uptime Institute survey median; wide range across operators"
    confidence_tier: 2
  on_premises:
    baseline_2024: 1.70
    range: [1.40, 2.20]
    distribution: triangular
    rationale: "Enterprise on-prem; Borderstep Germany data; high variance"
    confidence_tier: 2
  edge:
    baseline_2024: 1.55
    range: [1.30, 1.90]
    distribution: triangular
    rationale: "Edge DCs less optimised; limited data; proxy from colo"
    confidence_tier: 3

utilisation_by_type:
  hyperscale:
    baseline_2024: 0.65
    range: [0.50, 0.80]
    distribution: triangular
    rationale: "Hyperscaler disclosures; AWS/Azure/GCP operational data"
    confidence_tier: 1
  sovereign:
    baseline_2024: 0.45
    range: [0.25, 0.65]
    distribution: triangular
    rationale: "Sovereign cloud typically lower utilisation; proxy from EU operators"
    confidence_tier: 2
  colocation:
    baseline_2024: 0.55
    range: [0.30, 0.75]
    distribution: triangular
    rationale: "Uptime Institute survey; wide range by operator size"
    confidence_tier: 2
  on_premises:
    baseline_2024: 0.25
    range: [0.10, 0.45]
    distribution: triangular
    rationale: "Enterprise on-prem typically underutilised; Borderstep/Gartner"
    confidence_tier: 2
  edge:
    baseline_2024: 0.35
    range: [0.15, 0.55]
    distribution: triangular
    rationale: "Edge DCs variable utilisation; limited data"
    confidence_tier: 3

# AI compute growth rate (annual, fraction)
ai_compute_growth:
  baseline: 0.20
  range: [0.08, 0.70]
  distribution: log_normal
  rationale: "Epoch AI training compute dataset; Semi Analysis; historical ~3x/2yr"
  confidence_tier: 3

# kWh per EFLOP (declining with hardware efficiency)
kwh_per_eflop:
  baseline_2024: 0.001
  annual_improvement: 0.10
  range: [0.0005, 0.0020]
  distribution: triangular
  rationale: "Proxy from published training run energy disclosures; high uncertainty"
  confidence_tier: 3
