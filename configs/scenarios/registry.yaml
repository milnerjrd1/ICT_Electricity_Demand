scenarios:
  # ── Grid mix scenarios (from 2025 onward) ──────────────────────────────────
  - id: grid_mix_reference
    family: grid_mix
    label: "Grid Mix — Reference"
    description: "Moderate decarbonisation consistent with current national policies. Default grid scenario."
    color: "#6B7280"

  - id: grid_mix_ambitious
    family: grid_mix
    label: "Grid Mix — Ambitious"
    description: "Accelerated decarbonisation aligned with 1.5°C / IEA Net Zero 2050 pathway."
    color: "#10B981"

  - id: grid_mix_fossil
    family: grid_mix
    label: "Grid Mix — Fossil Persistence"
    description: "Slow decarbonisation; fossil fuel persistence in key markets. High-emissions risk scenario."
    color: "#EF4444"

  # ── AI / DC demand scenarios ───────────────────────────────────────────────
  - id: ai_base
    family: ai_dc
    label: "AI Base"
    description: "Central trajectory with 20% annual AI growth. DC capacity grows ~30% by 2035. Moderate PUE improvement."
    color: "#3B82F6"

  - id: ai_low
    family: ai_dc
    label: "AI Low"
    description: "Conservative AI adoption (5% annual growth). DC capacity grows ~5% by 2035. Longer device lifespans reduce churn."
    color: "#10B981"

  - id: ai_high
    family: ai_dc
    label: "AI High"
    description: "Accelerated AI build-out (45% annual growth). DC capacity doubles by 2035. Strong demand across all segments."
    color: "#EF4444"

  - id: ai_stress
    family: ai_dc
    label: "AI Stress"
    description: "Extreme AI demand (80% annual growth). DC capacity triples by 2035. Near physical limits of grid and cooling."
    color: "#7C3AED"

  - id: sovereignty_push
    family: sovereignty
    label: "Sovereignty Push"
    description: "Workload repatriation drives higher utilisation. Similar growth to baseline but with higher DC load factors."
    color: "#F59E0B"

  - id: grid_constrained
    family: grid
    label: "Grid Constrained"
    description: "Grid bottlenecks limit DC expansion (12% AI growth). Lower utilisation caps. Slowest DC growth after ai_low."
    color: "#6B7280"

  - id: efficiency_breakthrough
    family: efficiency
    label: "Efficiency Breakthrough"
    description: "Major efficiency gains across all segments. Slow AI growth (10%), strong network power savings, longer device lifespans."
    color: "#06B6D4"
